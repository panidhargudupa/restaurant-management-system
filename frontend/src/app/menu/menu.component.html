<div class="container-fluid py-4" style="background: #f8f9fa; min-height: 100vh;">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <div>
      <h2 class="fw-bold mb-0" style="color: #e74c3c;">🍽️ Our Menu</h2>
      <small class="text-muted">Fresh food, great taste</small>
    </div>
    <div class="d-flex gap-2">
      <a routerLink="/admin" class="btn btn-outline-secondary btn-sm">⚙️ Admin</a>
      <a routerLink="/cart" class="btn btn-danger position-relative">
        🛒 Cart
        <span *ngIf="cartCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
          {{cartCount}}
        </span>
      </a>
    </div>
  </div>

  <!-- Category Filter -->
  <div class="d-flex gap-2 flex-wrap px-3 mb-4">
    <button *ngFor="let cat of categories"
      class="btn btn-sm"
      [class.btn-danger]="selectedCategory === cat"
      [class.btn-outline-danger]="selectedCategory !== cat"
      (click)="filterByCategory(cat)">
      {{cat}}
    </button>
  </div>

  <!-- Menu Grid -->
  <div class="row g-4 px-3">
    <div class="col-md-4 col-sm-6" *ngFor="let item of filteredItems">
      <div class="card h-100 border-0 shadow-sm" style="border-radius: 16px; overflow: hidden;">
        <img [src]="item.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300'"
          class="card-img-top" style="height: 200px; object-fit: cover;"
          [alt]="item.name">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-1">
            <h5 class="card-title fw-bold mb-0">{{item.name}}</h5>
            <span class="badge" style="background: #fff3cd; color: #856404;">{{item.category}}</span>
          </div>
          <p class="text-muted small mb-3">{{item.description}}</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-5" style="color: #e74c3c;">₹{{item.price}}</span>
            <button class="btn btn-sm"
              [style.background]="addedItems.has(item.id!) ? '#2ecc71' : '#e74c3c'"
              style="color: white; border-radius: 20px; padding: 6px 16px;"
              (click)="addToCart(item)"
              [disabled]="!item.isAvailable">
              {{addedItems.has(item.id!) ? '✓ Added!' : '+ Add'}}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
